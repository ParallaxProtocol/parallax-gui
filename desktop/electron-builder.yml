# Packaging for Parallax Wallet. Run from desktop/ after building the
# frontend (../frontend/dist) and the backend for the target
# (../build/backend/<os>-<arch>/, see the Makefile). DISPLAY_ARCH names
# the architecture in artifact names the way releases always have
# (x86_64, arm64), which the in-app updater looks for.
appId: org.parallaxprotocol.wallet
productName: Parallax Wallet
copyright: Copyright © 2026 Parallax Protocol
directories:
  output: ../build/package
  buildResources: resources
files:
  - dist/**/*
  - "!dist/**/*.map"
  - resources/icon.png
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend
  # ${os} is mac, linux or win and ${arch} x64 or arm64, as the Makefile names them
  - from: ../build/backend/${os}-${arch}
    to: backend
asar: true
electronLanguages: [en-US, de, fr, pt-BR, ru, zh-CN, zh-TW]

# Fuses flipped in the packaged Electron binary: nothing outside the app
# can get code into the main process, which every password and recovery
# phrase passes through on its way to the backend. ELECTRON_RUN_AS_NODE,
# NODE_OPTIONS and --inspect (or SIGUSR1) are ignored, and only the
# app.asar the build sealed loads, checked against its hash on macOS and
# Windows (electron-builder records it in the bundle).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false

linux:
  target: [AppImage]
  executableName: parallax-wallet-app
  icon: resources/icon.png
  category: Utility
  synopsis: Parallax node and wallet connector
  artifactName: Parallax-Wallet-${version}-linux-${env.DISPLAY_ARCH}.${ext}
  desktop:
    entry:
      Name: Parallax Wallet
      StartupWMClass: parallax-wallet-app

mac:
  target: [dmg]
  icon: resources/icon.png
  category: public.app-category.finance
  # Ad-hoc signed only (no Developer ID), like the Wails builds before:
  # Apple Silicon refuses to run an unsigned app, and the in-app updater
  # opens the DMG for the user rather than replacing the app itself
  identity: "-"
  hardenedRuntime: false
  # The offline signer scans signing QR codes with the camera
  extendInfo:
    NSCameraUsageDescription: Parallax Wallet uses the camera to scan offline signing QR codes.
  artifactName: Parallax-Wallet-${version}-macos-${env.DISPLAY_ARCH}.${ext}
dmg:
  title: Parallax Wallet

win:
  target: [nsis, portable]
  icon: resources/icon.ico
  executableName: Parallax Wallet
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Parallax Wallet
  artifactName: Parallax-Wallet-${version}-windows-x86_64-setup.${ext}
portable:
  artifactName: Parallax-Wallet-${version}-windows-x86_64.${ext}

publish: null
