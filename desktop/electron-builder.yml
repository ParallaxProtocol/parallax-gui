# Packaging for Parallax Desktop. Run from desktop/ after building the
# frontend (../frontend/dist) and the backend for the target
# (../build/backend/<os>-<arch>/, see the Makefile). DISPLAY_ARCH names
# the architecture in artifact names the way releases always have
# (x86_64, arm64), which the in-app updater looks for.
appId: org.parallaxprotocol.desktop
productName: Parallax Client
copyright: Copyright © 2026 Parallax Protocol
directories:
  output: ../build/package
  buildResources: resources
files:
  - dist/**/*
  - "!dist/**/*.map"
  - resources/icon.png
  - package.json
extraResources:
  - from: ../frontend/dist
    to: frontend
  # ${os} is mac, linux or win and ${arch} x64 or arm64, as the Makefile names them
  - from: ../build/backend/${os}-${arch}
    to: backend
asar: true
electronLanguages: [en-US, de, fr, pt-BR, ru, zh-CN, zh-TW]

linux:
  target: [AppImage]
  executableName: parallax-client
  icon: resources/icon.png
  category: Utility
  synopsis: Parallax node and wallet connector
  artifactName: Parallax-Client-${version}-linux-${env.DISPLAY_ARCH}.${ext}
  desktop:
    entry:
      Name: Parallax Client
      StartupWMClass: parallax-client

mac:
  target: [dmg]
  icon: resources/icon.png
  category: public.app-category.finance
  # Ad-hoc signed only (no Developer ID), like the Wails builds before:
  # Apple Silicon refuses to run an unsigned app, and the in-app updater
  # opens the DMG for the user rather than replacing the app itself
  identity: "-"
  hardenedRuntime: false
  # The offline signer scans signing QR codes with the camera
  extendInfo:
    NSCameraUsageDescription: Parallax Client uses the camera to scan offline signing QR codes.
  artifactName: Parallax-Client-${version}-macos-${env.DISPLAY_ARCH}.${ext}
dmg:
  title: Parallax Client

win:
  target: [nsis, portable]
  icon: resources/icon.ico
  executableName: Parallax Client
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Parallax Client
  artifactName: Parallax-Client-${version}-windows-x86_64-setup.${ext}
portable:
  # The name Wails releases used for the Windows executable, so existing
  # installs find this as their next update
  artifactName: Parallax-Client-${version}-windows-x86_64.${ext}

publish: null
